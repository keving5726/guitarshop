services:
  php-fpm:
    image: keving5726/guitarshop
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - app-volume:/var/www/guitarshop
    networks:
      - app-network

  nginx:
    image: nginx:alpine-slim
    ports:
      - "80:80"
    depends_on:
      - php-fpm
    volumes:
      - ./docker/guitarshop.conf:/etc/nginx/conf.d/default.conf:ro
      - app-volume:/var/www/guitarshop:ro
    networks:
      - app-network

  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: guitarshop
      MARIADB_USER: guitarshop
      MARIADB_PASSWORD: guitarshop
      MARIADB_ROOT_PASSWORD: guitarshop
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-volume:
